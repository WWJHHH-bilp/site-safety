<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>基于YOLO的工地人员安全行为检测系统</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
<style>
  :root {
    --primary-bg: #0f172a;
    --secondary-bg: #1e293b;
    --accent: #3b82f6;
    --danger: #ef4444;
    --warning: #f59e0b;
    --success: #22c55e;
    --text: #e2e8f0;
    --card-bg: #1e293b;
    --border: #334155;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--primary-bg); color: var(--text); min-height: 100vh; }
  /* ... (truncated for brevity - full CSS would be here) ... */
</head>
<body>
  <!-- Navigation -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="#"><i class="bi bi-shield-check"></i> 安全行为检测系统</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="#">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="#live">实时监控</a></li>
          <li class="nav-item"><a class="nav-link" href="#history">历史记录</a></li>
          <li class="nav-item"><a class="nav-link" href="#settings">设置</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <section class="py-5 text-center" style="background: linear-gradient(135deg, #1e293b, #0f172a);">
    <div class="container">
      <h1 class="display-4 fw-bold mb-3">🏗️ 工地人员安全行为检测系统</h1>
      <p class="lead mb-4">基于YOLOv8的实时视频分析平台</p>
      <div class="row justify-content-center">
        <div class="col-md-3">
          <div class="card bg-secondary text-white">
            <div class="card-body">
              <h3 class="display-5 fw-bold text-primary">98.5%</h3>
              <p>检测准确率</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card bg-secondary text-white">
            <div class="card-body">
              <h3 class="display-5 fw-bold text-success">32</h3>
              <p>实时摄像头</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card bg-secondary text-white">
            <div class="card-body">
              <h3 class="display-5 fw-bold text-warning">128</h3>
              <p>今日检测数</p>
            </div>
          </div>
        </div>
        <div class="col-md-3">
          <div class="card bg-secondary text-white">
            <div class="card-body">
              <h3 class="display-5 fw-bold text-danger">3</h3>
              <p>违规告警</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Live Monitoring Section -->
  <section id="live" class="py-5" style="background: var(--secondary-bg);">
    <div class="container">
      <h2 class="text-center mb-4"><i class="bi bi-camera-video"></i> 实时监控</h2>
      <div class="row g-4">
        <div class="col-lg-8">
          <div class="card bg-dark border border-secondary">
            <div class="card-header bg-secondary d-flex justify-content-between align-items-center">
              <span><i class="bi bi-signal"></i> 摄像头 1 - 主入口</span>
              <span class="badge bg-danger">LIVE</span>
            </div>
            <div class="card-body">
              <div class="ratio ratio-16x9" style="background: #000;">
                <iframe src="https://via.placeholder.com/1280x720/1a1a2e/ffffff?text=YOLO+Detection+Feed" class="w-100" style="border: none;" allowfullscreen></iframe>
              </div>
              <div class="mt-3 d-flex gap-2">
                <span class="badge bg-primary">Person: 12</span>
                <span class="badge bg-warning">Helmet: 8</span>
                <span class="badge bg-danger">Violation: 2</span>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card bg-dark border border-secondary">
            <div class="card-header bg-secondary">
              <span><i class="bi bi-list-ul"></i> 告警列表</span>
            </div>
            <div class="card-body" style="max-height: 400px; overflow-y: auto;">
              <div class="alert alert-danger d-flex align-items-center mb-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <div>
                  <strong>未戴安全帽</strong> - 工人 #42 在主入口区域
                  <small class="text-muted">2分钟前</small>
                </div>
              </div>
              <div class="alert alert-warning d-flex align-items-center mb-2" role="alert">
                <i class="bi bi-clipboard-x me-2"></i>
                <div>
                  <strong>闯入危险区域</strong> - 人员 #17 进入机械作业区
                  <small class="text-muted">5分钟前</small>
                </div>
              </div>
              <div class="alert alert-danger d-flex align-items-center mb-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <strong>未穿反光衣</strong> - 工人 #88 在吊装区域
                <small class="text-muted">8分钟前</small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- History Section -->
  <section id="history" class="py-5">
    <div class="container">
      <h2 class="text-center mb-4"><i class="bi bi-clock-history"></i> 历史检测记录</h2>
      <div class="table-responsive">
        <table class="table table-dark table-striped table-hover">
          <thead>
            <tr>
              <th>时间</th>
              <th>摄像头</th>
              <th>类型</th>
              <th>描述</th>
              <th>置信度</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>2026-10-29 14:32</td>
              <td>摄像头 3</td>
              <td><span class="badge bg-danger">未戴安全帽</span></td>
              <td>工人未佩戴安全帽进入施工区域</td>
              <td>0.96</td>
              <td><button class="btn btn-sm btn-outline-light">查看详情</button></td>
            </tr>
            <tr>
              <td>2026-10-29 14:28</td>
              <td>摄像头 1</td>
              <td><span class="badge bg-warning">闯入危险区域</span></td>
              <td>人员误入机械作业区域</td>
              <td>0.89</td>
              <td><button class="btn btn-sm btn-outline-light">查看详情</button></td>
            </tr>
            <tr>
              <td>2026-10-29 14:15</td>
              <td>摄像头 2</td>
              <td><span class="badge bg-danger">未穿反光衣</span></td>
              <td>工人未在高风险区域穿着反光衣</td>
              <td>0.92</td>
              <td><button class="btn btn-sm btn-outline-light">查看详情</button></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <!-- Settings Section -->
  <section id="settings" class="py-5" style="background: var(--secondary-bg);">
    <div class="container">
      <h2 class="text-center mb-4"><i class="bi bi-gear"></i> 系统设置</h2>
      <div class="row g-4">
        <div class="col-md-6">
          <div class="card bg-dark border border-secondary">
            <div class="card-header bg-secondary">YOLO 模型配置</div>
            <div class="card-body">
              <div class="mb-3">
                <label class="form-label">模型文件</label>
                <select class="form-select bg-dark text-light border-secondary">
                  <option value="yolov8n.pt">YOLOv8n (轻量)</option>
                  <option value="yolov8s.pt">YOLOv8s (标准)</option>
                  <option value="yolov8m.pt">YOLOv8m (精确)</option>
                </select>
              </div>
              <div class="mb-3">
                <label class="form-label">置信度阈值</label>
                <input type="range" class="form-range" min="0.1" max="0.9" step="0.05" value="0.5">
                <span class="text-muted">0.50</span>
              </div>
              <div class="mb-3">
                <label class="form-label">NMS 阈值</label>
                <input type="range" class="form-range" min="0.1" max="0.7" step="0.05" value="0.45">
                <span class="text-muted">0.45</span>
              </div>
            </div>
          </div>
        </div>
        <div class="col-md-6">
          <div class="card bg-dark border border-secondary">
            <div class="card-header bg-secondary">告警配置</div>
            <div class="card-body">
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" checked>
                <label class="form-check-label">邮件告警</label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox" checked>
                <label class="form-check-label">短信告警</label>
              </div>
              <div class="form-check mb-2">
                <input class="form-check-input" type="checkbox">
                <label class="form-check-label">声光报警</label>
              </div>
              <div class="mt-3">
                <button class="btn btn-primary w-100">保存配置</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="py-4 text-center text-muted border-top border-secondary" style="background: var(--primary-bg);">
    <div class="container">
      <p class="mb-1">© 2026 工地人员安全行为检测系统 | 基于YOLOv8</p>
      <small>版本 v1.0.0 | 检测模型: YOLOv8m.pt</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Demo: Simulate real-time detection updates
    const violations = document.querySelectorAll('.alert');
    let idx = 0;
    setInterval(() => {
      idx = (idx + 1) % violations.length;
      violations[idx].classList.add('animate__animated', 'animate__pulse');
      setTimeout(() => violations[idx].classList.remove('animate__animated', 'animate__pulse'), 1000);
    }, 3000);
  </script>
</body>
</html>
